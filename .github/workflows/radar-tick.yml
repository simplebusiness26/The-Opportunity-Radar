name: Radar Production Tick

on:
  workflow_dispatch:
  push:
    branches: [claude/opportunity-radar-build-jxy1gg]
    paths:
      - '.github/workflows/radar-tick.yml'
  schedule:
    # Offset from the top of the hour to reduce GitHub Actions scheduling congestion.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  statuses: write

concurrency:
  group: radar-production-tick
  cancel-in-progress: false

jobs:
  tick:
    name: Run Radar serverless tick
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: production
    env:
      RADAR_URL: https://the-opportunity-radar.vercel.app
      RADAR_TICK_TOKEN: ${{ secrets.RADAR_TICK_TOKEN }}
    steps:
      - name: Skip safely until token is configured
        if: ${{ env.RADAR_TICK_TOKEN == '' }}
        run: echo "RADAR_TICK_TOKEN is not configured in the GitHub production environment; scheduled Radar tick skipped."

      - name: Run Radar tick
        if: ${{ env.RADAR_TICK_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 55 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${RADAR_TICK_TOKEN}" \
            --header 'Content-Type: application/json' \
            "${RADAR_URL}/api/v1/system/tick")"

          cat "$response_file"
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Radar tick failed with HTTP ${http_code}."
            exit 1
          fi

          echo "Radar production tick completed successfully (HTTP ${http_code})."

      - name: Frame evidence-backed opportunities
        if: ${{ env.RADAR_TICK_TOKEN != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 55 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${RADAR_TICK_TOKEN}" \
            --header 'Content-Type: application/json' \
            "${RADAR_URL}/api/v1/system/frame-opportunities")"

          cat "$response_file"
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Radar opportunity framing failed with HTTP ${http_code}."
            exit 1
          fi

          description="$(python - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              body = json.load(handle)
          data = body.get('data', {})
          seeded = data.get('seeded', {})
          framed = data.get('framed', {})
          print(
              f"clusters {int(seeded.get('created', 0))}; "
              f"opportunities {int(framed.get('created', 0))}; "
              f"evidence considered {int(seeded.get('considered', 0))}"
          )
          PY
          )"

          payload="$(DESCRIPTION="$description" python - <<'PY'
          import json, os
          print(json.dumps({
              'state': 'success',
              'context': 'Radar opportunity framing',
              'description': os.environ['DESCRIPTION'][:140],
          }))
          PY
          )"

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload"
          echo
          echo "Radar opportunity framing completed successfully (HTTP ${http_code}): ${description}."
